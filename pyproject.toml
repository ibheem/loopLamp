[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "looplamp"
version = "0.1.0"
description = "LoopLamp project"
authors = [ { name = "prashant" } ]
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["backend*"]
